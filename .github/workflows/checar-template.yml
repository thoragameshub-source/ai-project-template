name: checar-template
on:
  push:
  pull_request:
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pacotes x niveis.json x STARTUP.md
        run: python tools/startup.py checar
